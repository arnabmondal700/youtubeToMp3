<div class="faq-page">
  <div class="container">
    <div class="faq-hero">
      <h1 class="page-title">Frequently Asked Questions</h1>
      <p class="page-description">Find answers to common questions about our YouTube to MP3 converter.</p>
    </div>

    <mat-accordion class="faq-accordion">
      @for (faq of faqs; track faq.question) {
        <mat-expansion-panel class="faq-panel">
          <mat-expansion-panel-header>
            <mat-panel-title class="faq-question">{{ faq.question }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p class="faq-answer">{{ faq.answer }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</div>
